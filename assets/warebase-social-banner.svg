<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151F38"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="badgeGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3E68"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="628" fill="url(#bgGrad)"/>

  <!-- faint grid pattern nodding to warehouse racking / bin locations -->
  <g stroke="#26365C" stroke-width="1" opacity="0.6">
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="628"/>
    <line x1="450" y1="0" x2="450" y2="628"/>
    <line x1="750" y1="0" x2="750" y2="628"/>
    <line x1="1050" y1="0" x2="1050" y2="628"/>
  </g>

  <!-- icon mark, large, right side -->
  <g transform="translate(830,204)">
    <rect x="0" y="0" width="220" height="220" rx="42" fill="url(#badgeGradB)"/>
    <rect x="48" y="150" width="124" height="16" rx="8" fill="#E8A23D"/>
    <rect x="55" y="106" width="24" height="44" rx="4" fill="#AEB9C4"/>
    <rect x="88" y="84" width="24" height="66" rx="4" fill="#EEF2F5"/>
    <rect x="121" y="58" width="24" height="92" rx="4" fill="#F0B15C"/>
    <rect x="127" y="68" width="13" height="6" rx="3" fill="#151F38"/>
  </g>

  <!-- wordmark + tagline, left side -->
  <text x="90" y="290" font-family="'Space Grotesk','Arial',sans-serif" font-size="76" font-weight="500" fill="#F7F8FA">Ware<tspan fill="#F0B15C" font-weight="700">Base</tspan></text>
  <text x="92" y="335" font-family="'IBM Plex Mono','Courier New',monospace" font-size="22" letter-spacing="2" fill="#AEB9C4">EVERY ITEM, IN ITS PLACE</text>

  <text x="92" y="400" font-family="'Inter','Arial',sans-serif" font-size="22" fill="#C7CEDA">Know what you have, where it is,</text>
  <text x="92" y="432" font-family="'Inter','Arial',sans-serif" font-size="22" fill="#C7CEDA">and when it's running low.</text>
</svg>
