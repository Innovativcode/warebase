<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22345C"/>
      <stop offset="100%" stop-color="#151F38"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#badgeGrad)"/>
  <!-- baseline plate -->
  <rect x="26" y="82" width="68" height="9" rx="4.5" fill="#E8A23D"/>
  <!-- ascending bars representing stock levels rising from the base -->
  <rect x="30" y="58" width="13" height="24" rx="2.5" fill="#AEB9C4"/>
  <rect x="48" y="46" width="13" height="36" rx="2.5" fill="#EEF2F5"/>
  <rect x="66" y="32" width="13" height="50" rx="2.5" fill="#F0B15C"/>
  <!-- scan tick on tallest bar, nods to inventory scanning -->
  <rect x="69" y="37" width="7" height="3" rx="1.5" fill="#151F38"/>
</svg>
