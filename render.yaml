services:
  - type: web
    name: warebase-api
    runtime: node
    buildCommand: npm install && npm run build:api
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3000
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: inventory_session
      - key: CORS_ORIGIN
        value: https://warebase.getcognix.shop,https://staging-warebase.getcognix.shop
    healthCheckPath: /health
